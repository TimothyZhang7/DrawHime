    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
        root /www/sites/admin.xanime.ink/index;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary Accept-Encoding;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ===== API 代理 =====
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:6369/api/;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:6369/auth/;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:6369/admin/;
        proxy_read_timeout 1200s;
    }

    location ^~ /wsproxy/ {
        proxy_pass http://127.0.0.1:6369/wsproxy/;
    }

    # SPA 前端
    root /www/sites/admin.xanime.ink/index;
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    error_page 497 https://$host$request_uri;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/admin.xanime.ink/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/admin.xanime.ink/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
}
