# Nginx/OpenResty 参考配置（当前主用 www.xanime.ink / admin.xanime.ink）
#
# 约束：
# - 仅代理真正的后端 API 路径：/api/ /auth/ /qq/ /images/ /wsproxy/
# - /generate /gallery /generations /templates /recharge /status 是前端 SPA 页面，不代理
# - 对应后端 API 在 /api/gallery /api/generations /api/status 等 /api/ 前缀下
# - 生产配置在 /data/1panel/www/conf.d/*.conf，修改后用 1Panel-openresty-* 容器执行 openresty -t 和 reload

# ===== 用户端: www.xanime.ink / xanime.ink =====
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.xanime.ink xanime.ink;
    index index.html;

    # 缓存静态文件元数据，降低源站直连访问时的磁盘 stat 开销。
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    access_log /www/sites/xanime.ink/log/access.log main;
    error_log /www/sites/xanime.ink/log/error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto https;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # 独立本地模型平台：静态目录位于主站 index 之外，主站发布不会清理该路径。
    location ^~ /local-model-api/ {
        proxy_pass http://127.0.0.1:7102/;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /local-model/ {
        root /www/sites/xanime.ink;
        try_files $uri $uri/ /local-model/index.html;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
        root /www/sites/xanime.ink/index;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary Accept-Encoding;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ===== 仅代理后端 API =====
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:6369/api/;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # 兼容误发到 API 路径的邮箱验证 GET 链接；POST 必须继续由 /auth/ 代理给 backend 执行真实验证。
    location = /auth/verify-email {
        if ($request_method = GET) {
            return 302 /verify-email$is_args$args;
        }
        proxy_pass http://127.0.0.1:6369/auth/verify-email;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:6369/auth/;
    }

    location ^~ /qq/ {
        proxy_pass http://127.0.0.1:6369/qq/;
    }

    location ^~ /images/ {
        proxy_pass http://127.0.0.1:6369/images/;
    }

    location ^~ /wsproxy/ {
        proxy_pass http://127.0.0.1:6369/wsproxy/;
    }

    location = /api/workflows {
        return 404;
    }

    location ^~ /api/workflows/ {
        return 404;
    }

    location = /workflow {
        return 404;
    }

    location ^~ /workflow/ {
        return 404;
    }

    # SPA 前端 — 所有非 API 路径返回 index.html
    root /www/sites/xanime.ink/index;
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    error_page 497 https://$host$request_uri;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/xanime.ink/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/xanime.ink/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
}

# ===== OneBot WebSocket: wsbot.xanime.ink =====
server {
    listen 80;
    listen 443 ssl http2;
    server_name wsbot.xanime.ink;

    access_log /www/sites/wsbot.xanime.ink/log/access.log main;
    error_log /www/sites/wsbot.xanime.ink/log/error.log;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3011/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OneBot 动态端点：旧 pathSuffix 和 access_token 不变，ws 切 wss 只需给协议加 s。
    location = /ws-bot {
        proxy_pass http://127.0.0.1:3011/ws-bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ^~ /ws-bot/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }

    ssl_certificate /www/sites/wsbot.xanime.ink/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/wsbot.xanime.ink/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
}

# ===== 管理端: admin.xanime.ink =====
server {
    listen 80;
    listen 443 ssl http2;
    server_name admin.xanime.ink;
    index index.html;

    # 缓存静态文件元数据，降低静态资源回源时的磁盘 stat 开销。
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    access_log /www/sites/admin.xanime.ink/log/access.log main;
    error_log /www/sites/admin.xanime.ink/log/error.log;

    proxy_set_header Host $host;
