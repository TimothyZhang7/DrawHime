# 本工作流将日常快速检查与发布前完整 Windows 验收分离，避免每次提交重复构建离线安装包。
name: Desktop Windows Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-windows.yml"
      - "local-platform/apps/desktop/**"
      - "local-platform/scripts/validate-desktop-windows-host.ps1"
      - "local-platform/scripts/validate-desktop-webview-ui.mjs"
      - "local-platform/packages/contracts/**"
      - "local-platform/package.json"
      - "local-platform/pnpm-lock.yaml"
      - "local-platform/pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      full_validation:
        description: "执行发布前 Release Rust、离线 NSIS 与双系统安装验收"
        required: true
        type: boolean
        default: false
      publish_release:
        description: "在完整验收通过后创建同一提交的 GitHub Release"
        required: true
        type: boolean
        default: false
      release_notes:
        description: "GitHub Release 版本说明；仅发布时必填"
        required: false
        type: string
        default: ""

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    name: windows-2022-quick-check
    if: github.event_name == 'push' || inputs.full_validation != true
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        working-directory: local-platform
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: local-platform/pnpm-lock.yaml

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 构建桌面共享契约
        run: pnpm --filter @drawhime/contracts run build

      - name: 检查桌面 TypeScript
        run: pnpm --filter @drawhime/desktop run type-check

      - name: 判断 Rust 核心是否变化
        id: native-change
        shell: pwsh
        run: |
          $before = "${{ github.event.before }}"
          $nativeChanged = $true
          if ($before -and $before -notmatch '^0+$') {
            $changedFiles = @(git diff --name-only $before $env:GITHUB_SHA -- "apps/desktop/src-tauri")
            $nativeChanged = $changedFiles.Count -gt 0
          }
          "changed=$($nativeChanged.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8

      - name: 安装 Rust
        if: steps.native-change.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: 恢复 Rust 测试缓存
        if: steps.native-change.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-platform/apps/desktop/src-tauri -> target
          shared-key: desktop-windows-2022-debug
          cache-on-failure: true

      - name: 运行受影响的 Rust 测试
        if: steps.native-change.outputs.changed == 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  build-installer:
    name: windows-2022-build
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: local-platform
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: local-platform/pnpm-lock.yaml

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-platform/apps/desktop/src-tauri -> target
          shared-key: desktop-windows-2022-release
          cache-on-failure: true

      - name: 恢复 Tauri 打包工具缓存
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-windows-x64-v1

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 构建桌面共享契约
        run: pnpm --filter @drawhime/contracts run build

      - name: 检查桌面 TypeScript
        run: pnpm --filter @drawhime/desktop run type-check

      - name: 运行 Release Rust 测试
        run: cargo test --release --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: 构建 WebView2 离线 NSIS
        shell: pwsh
        run: |
          $bundleDirectory = Join-Path $PWD "apps/desktop/src-tauri/target/release/bundle"
          if (Test-Path -LiteralPath $bundleDirectory -PathType Container) {
            Remove-Item -LiteralPath $bundleDirectory -Recurse -Force
          }
          pnpm --filter @drawhime/desktop run tauri:build

      - name: 校验安装包边界
        shell: pwsh
        run: |
          $bundleDirectory = Join-Path $PWD "apps/desktop/src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path -LiteralPath $bundleDirectory -PathType Container)) { throw "NSIS 输出目录不存在：$bundleDirectory" }
          $installers = @(Get-ChildItem -LiteralPath $bundleDirectory -File -Filter "*.exe")
          $installers | ForEach-Object { Write-Host "NSIS 文件：$($_.Name)，字节数：$($_.Length)" }
          if ($installers.Count -ne 1) { throw "NSIS 输出目录应当只包含一个安装包，实际为 $($installers.Count) 个" }
          $installer = $installers[0]
          if ($installer.Name -notmatch "_x64-setup\.exe$") { throw "安装包命名不符合 x64 NSIS 约定：$($installer.Name)" }
          if ($installer.Length -lt 150MB) { throw "安装包缺少 WebView2 离线载荷，实际字节数：$($installer.Length)" }
          $summary = "### windows-2022-build`n- 安装包：$($installer.Name)`n- 字节数：$($installer.Length)`n- SHA-256：$((Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding UTF8

      - name: 上传待验收安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-installer
          path: local-platform/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  install-validation:
    name: ${{ matrix.os }}-install
    needs: build-installer
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        working-directory: local-platform
    steps:
      - name: 检出验收脚本
        uses: actions/checkout@v4

      - name: 安装 UI 探针 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载待验收安装包
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64-installer
          path: ${{ runner.temp }}/desktop-installer

      - name: 验证 NSIS 安装与桌面启动
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/desktop-installer" -File -Filter "*.exe") | Select-Object -First 1
          if (-not $installer) { throw "未找到待验收的 NSIS 安装包" }
          $expectedVersion = (Get-Content -Raw "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/validate-desktop-windows-host.ps1" -ExpectedVersion $expectedVersion -Installer $installer.FullName -EvidenceDirectory "$env:RUNNER_TEMP/desktop-host-validation" -ExpectNoGpu -ValidateUninstall
          if ($LASTEXITCODE -ne 0) { throw "Windows 主机验收脚本退出码：$LASTEXITCODE" }
          $evidence = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/desktop-host-validation" -File -Filter "*.json") | Select-Object -First 1
          if (-not $evidence) { throw "Windows 主机验收未输出证据文件" }
          $evidenceData = Get-Content -Raw $evidence.FullName | ConvertFrom-Json
          $hostSummary = "### ${{ matrix.os }}`n- 安装与启动验收：$($evidence.Name)`n- 主机：$($evidenceData.os.caption)，构建 $($evidenceData.os.build)`n- DPI：$($evidenceData.dpi.value)，Per-Monitor V2=$($evidenceData.dpi.perMonitorV2)`n- WebView2：$($evidenceData.webView2Version)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $hostSummary -Encoding UTF8

      - name: 验证无 GPU WebView 门禁
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $installation = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq "DrawHime Desktop" } | Select-Object -First 1
          if (-not $installation) { throw "UI 验收前未找到桌面安装登记" }
          $executable = Join-Path ([string]$installation.InstallLocation).Trim('"') "drawhime-desktop.exe"
          node scripts/validate-desktop-webview-ui.mjs --executable $executable --expect-no-gpu --evidence "$env:RUNNER_TEMP/desktop-host-validation/webview-no-gpu.json"
          if ($LASTEXITCODE -ne 0) { throw "WebView 无 GPU 门禁验收退出码：$LASTEXITCODE" }

      - name: 保存 Windows 主机验收证据
        uses: actions/upload-artifact@v4
        with:
          name: desktop-host-validation-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-host-validation/*.json
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: publish-github-release
    needs: install-validation
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation && inputs.publish_release && needs.install-validation.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: local-platform
    steps:
      - name: 检出已完整验收的源码
        uses: actions/checkout@v4

      - name: 下载已验收安装包
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64-installer
          path: ${{ runner.temp }}/desktop-release

      - name: 验证发布说明与安装包
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          # 当前 Release 必须依赖本次 workflow 的 Windows 2022/2025 安装验收；长期人工兼容矩阵不作为一次发布的伪完成门禁。
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) { throw "创建 GitHub Release 时必须填写 release_notes" }
          $version = (Get-Content -Raw "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          if ($version -notmatch "^\d+\.\d+\.\d+$") { throw "桌面版本号格式无效：$version" }
          $installer = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/desktop-release" -File -Filter "*.exe") | Select-Object -First 1
          if (-not $installer) { throw "发布前未找到已验收的 NSIS 安装包" }
          if ($installer.Name -notmatch "_x64-setup\.exe$") { throw "发布安装包命名不符合 x64 NSIS 约定：$($installer.Name)" }
          if ($installer.Length -lt 150MB) { throw "发布安装包缺少 WebView2 离线载荷，实际字节数：$($installer.Length)" }
          "RELEASE_TAG=v$version" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          $summary = "### GitHub Release 预检`n- 版本：$version`n- 安装包：$($installer.Name)`n- SHA-256：$((Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding UTF8

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) { throw "GitHub Release 已存在：$env:RELEASE_TAG" }
          $installer = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/desktop-release" -File -Filter "*.exe") | Select-Object -First 1
          gh release create $env:RELEASE_TAG $installer.FullName --target $env:GITHUB_SHA --title "DrawHime Desktop $env:RELEASE_TAG" --notes $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 创建失败" }
