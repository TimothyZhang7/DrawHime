services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: drawhime_local
      MARIADB_USER: local_platform
      MARIADB_PASSWORD: local_platform
      MARIADB_ROOT_PASSWORD: local_root
    ports:
      - "3317:3306"
    volumes:
      - local_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6390:6379"
    volumes:
      - local_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local_access
      MINIO_ROOT_PASSWORD: local_secret_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - local_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 local_access local_secret_dev_only &&
        mc mb --ignore-existing local/drawhime-local
    restart: "no"

volumes:
  local_mariadb:
  local_redis:
  local_minio:
