# 本文件编排生产环境独立数据基础设施，所有端口只绑定宿主机回环地址。
name: drawhime-local-platform

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: drawhime_local
      MARIADB_USER: local_platform
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - local_platform_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${LOCAL_REDIS_PASSWORD}"]
    environment:
      LOCAL_REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - local_platform_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${LOCAL_REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - local_platform_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/drawhime-local
    restart: "no"

volumes:
  local_platform_mariadb:
  local_platform_redis:
  local_platform_minio:
